[alembic]
# path to migration scripts
script_location = alembic

# database URL (overridden by environment variable DATABASE_URL)
sqlalchemy.url = postgresql+psycopg://postgres:password@localhost:5432/mini_ecommerce

# version location
version_locations = alembic/versions

# timezone to use when rendering the date
# within the migration file as well as the filename.
# string value is passed to dateutil.tz.gettz()
# leave blank for localtime
timezone = UTC

# max length of characters to apply to the
# "version code" in generated migration files
# max_version_code_length = 32

# template used to generate migration files
# The file ${script_location}/__init__.py is missing, so alembic will
# import from the script_location directory.
# import = alembic

# sqlite specific settings
# render_as_batch = true

# output encoding
output_encoding = utf-8

sqlalchemy.warn_20 = true

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.
# See https://alembic.sqlalchemy.org/en/latest/tutorial.html#post-write-hooks
# for more details

# hooks run in the order specified
# hooks = my_hook_script

# example: run the "black" code formatter
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers = console
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
handlers = console

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S