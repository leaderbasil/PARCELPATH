services:
  db:
    image: postgres:15
    container_name: mini-ecommerce-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mini_ecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mini_ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mini-ecommerce-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://postgres:password@db:5432/mini_ecommerce
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-dev-secret-change-me-1234567890}
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      FRONTEND_ORIGIN: http://localhost:5173
      SHIPPING_FEE: "0.00"
      CURRENCY_CODE: USD
      REPORT_TIMEZONE: UTC
      FIRST_ADMIN_EMAIL: admin@example.com
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:-change-me-now}
    ports:
      - "8000:8000"
    command: >-
      sh -c "alembic upgrade head &&
      python -m app.db.init_db &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mini-ecommerce-frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
      VITE_CURRENCY_CODE: USD

volumes:
  postgres_data:
