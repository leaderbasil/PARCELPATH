<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4F46E5" />
    <meta name="description" content="PARCELPATH order and shipment tracking." />
    <link rel="icon" type="image/png" href="/favicon-dark.png" />
    <link rel="icon" type="image/png" media="(prefers-color-scheme: light)" href="/favicon-light.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply saved appearance and language before first paint.
      (function () {
        try {
          var root = document.documentElement;
          var storedTheme = localStorage.getItem("parcelpath-theme");
          var theme = storedTheme === "dark" || storedTheme === "light" ? storedTheme : "light";
          root.setAttribute("data-theme", theme);
          root.style.colorScheme = theme;
          root.classList.toggle("dark", theme === "dark");

          var locale = localStorage.getItem("parcelpath-locale") === "en" ? "en" : "ar";
          root.lang = locale;
          root.dir = locale === "ar" ? "rtl" : "ltr";
        } catch (error) {
          /* Storage may be unavailable; light theme + Arabic RTL remain the defaults. */
        }
      })();
    </script>
    <title>PARCELPATH</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
